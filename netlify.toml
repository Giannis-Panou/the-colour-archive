[build]
  command = "npm run build"
  publish = "dist"

# Security headers for every page.
# The CSP allows only this site's own scripts, Google Fonts, and the Supabase project
# (data, photo links and sign-in). Inline styles are needed for React's style attributes.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://sknomfblienlqzkqlzqp.supabase.co; connect-src 'self' data: https://sknomfblienlqzkqlzqp.supabase.co wss://sknomfblienlqzkqlzqp.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
